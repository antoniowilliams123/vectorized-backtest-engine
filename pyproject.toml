[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorized-backtest-engine"
version = "0.1.0"
description = "numpy-vectorized event-study engine for 1-minute bar archives"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tony Williams" }]
dependencies = [
    "numpy>=1.26",
    "pyarrow>=14",
    "pandas>=2.0",  # reference implementation for tests + benchmarks only
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools]
packages = ["vbtengine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
